<!DOCTYPE html>
<!-- v6 – Ultra-compact Apple Desktop Widget for Google Antigravity -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Widget</title>
  <style>
    :root {
      --text: #ffffff;
      --text-sec: rgba(255, 255, 255, 0.65);
      --text-muted: rgba(255, 255, 255, 0.40);
      --card: rgba(26, 26, 30, 0.82);
      --card-border: rgba(255, 255, 255, 0.14);
      --track: rgba(255, 255, 255, 0.12);
      --green: #30d158;
      --yellow: #ffd60a;
      --red: #ff453a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      background: transparent;
      color: var(--text);
      width: 240px;
      height: 124px;
      padding: 10px 12px;
      overflow: hidden;
      cursor: grab;
      -webkit-font-smoothing: antialiased;
    }

    body:active {
      cursor: grabbing;
    }

    .widget-container {
      width: 100%;
      height: 100%;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 9px 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .widget-container:hover {
      border-color: rgba(255, 255, 255, 0.25);
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .sparkle {
      color: #0a84ff;
    }

    .badge {
      font-size: 8.5px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 1px 5px;
      border-radius: 5px;
      background: rgba(255, 214, 10, 0.2);
      color: #ffd60a;
      border: 1px solid rgba(255, 214, 10, 0.35);
    }

    .close-btn {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text-sec);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.15s ease, background 0.15s ease;
    }

    .widget-container:hover .close-btn {
      opacity: 1;
    }

    .close-btn:hover {
      background: rgba(255, 69, 58, 0.6);
      color: #fff;
    }

    .meters {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meter-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .meter-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9.5px;
    }

    .name {
      color: var(--text-sec);
      font-weight: 500;
    }

    .pct {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .bar-bg {
      width: 100%;
      height: 4px;
      background: var(--track);
      border-radius: 2px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .bar-fill.green { background: var(--green); }
    .bar-fill.yellow { background: var(--yellow); }
    .bar-fill.red { background: var(--red); }
  </style>
</head>
<body>
  <div class="widget-container" id="widget-card">
    <div class="top-row">
      <div class="brand">
        <span class="sparkle">✦</span>
        <span>Antigravity</span>
        <span class="badge" id="w-badge">Ultra</span>
      </div>
      <button class="close-btn" id="btn-close-widget" title="Close Widget">×</button>
    </div>

    <div class="meters">
      <div class="meter-row">
        <div class="meter-meta">
          <span class="name">Gemini (5h)</span>
          <span class="pct" id="g-pct" style="color: var(--green)">84%</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill green" id="g-bar" style="width: 84%"></div>
        </div>
      </div>

      <div class="meter-row">
        <div class="meter-meta">
          <span class="name">Claude & GPT</span>
          <span class="pct" id="c-pct" style="color: var(--green)">98%</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill green" id="c-bar" style="width: 98%"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://127.0.0.1:3007/quota';
    const gPct = document.getElementById('g-pct');
    const gBar = document.getElementById('g-bar');
    const cPct = document.getElementById('c-pct');
    const cBar = document.getElementById('c-bar');
    const wBadge = document.getElementById('w-badge');
    const btnClose = document.getElementById('btn-close-widget');
    const widgetCard = document.getElementById('widget-card');

    function updateWidgetUI(data) {
      if (!data) return;
      const tier = data.tier || 'Ultra';
      wBadge.textContent = tier.toLowerCase().includes('ultra') ? 'Ultra' : tier;

      (data.groups || []).forEach(group => {
        const name = (group.displayName || group.name || '').toLowerCase();
        let minFrac = 1.0;
        (group.buckets || []).forEach(b => {
          if (b.remainingFraction != null) {
            minFrac = Math.min(minFrac, b.remainingFraction);
          }
        });
        const pct = Math.round(minFrac * 100);
        let colorClass = 'green';
        if (pct < 20) colorClass = 'red';
        else if (pct < 50) colorClass = 'yellow';

        if (name.includes('gemini')) {
          gPct.textContent = pct + '%';
          gPct.style.color = `var(--${colorClass})`;
          gBar.style.width = pct + '%';
          gBar.className = `bar-fill ${colorClass}`;
        } else {
          cPct.textContent = pct + '%';
          cPct.style.color = `var(--${colorClass})`;
          cBar.style.width = pct + '%';
          cBar.className = `bar-fill ${colorClass}`;
        }
      });
    }

    async function fetchWidgetData() {
      try {
        const res = await fetch(API_URL);
        if (res.ok) {
          const data = await res.json();
          updateWidgetUI(data);
        }
      } catch (e) {}
    }

    btnClose.addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.appAction) {
        window.webkit.messageHandlers.appAction.postMessage({ action: "closeWidget" });
      }
    });

    widgetCard.addEventListener('dblclick', () => {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.appAction) {
        window.webkit.messageHandlers.appAction.postMessage({ action: "openFullApp" });
      }
    });

    fetchWidgetData();
  </script>
</body>
</html>
