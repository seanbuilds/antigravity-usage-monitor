<!DOCTYPE html>
<!-- v1 – Initial UI for Antigravity Usage native macOS desktop application -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Usage</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.85);
      --card-border: rgba(48, 54, 61, 0.8);
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --purple: #bc8cff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px 22px 24px;
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Top window drag area for frameless macOS window */
    .titlebar-drag {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 32px;
      -webkit-app-region: drag;
      z-index: 100;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, #1f6feb 0%, #a371f7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 17px;
      box-shadow: 0 4px 12px rgba(88, 166, 255, 0.3);
    }

    .title-group h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .title-group p {
      font-size: 11px;
      color: var(--text-dim);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-refresh {
      background: rgba(48, 54, 61, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-refresh:hover {
      background: rgba(56, 139, 253, 0.2);
      border-color: var(--accent);
    }

    .btn-refresh:active {
      transform: scale(0.94);
    }

    .btn-refresh.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Account Badge Pill */
    .account-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 18px;
      backdrop-filter: blur(10px);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    .user-email {
      font-size: 13px;
      font-weight: 600;
    }

    .tier-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(56, 139, 253, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 139, 253, 0.3);
      text-transform: capitalize;
    }

    /* Groups */
    .group-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 16px 14px;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }

    .group-title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .group-title.gemini { color: #58a6ff; }
    .group-title.claude { color: #d2a8ff; }

    .group-models {
      font-size: 11px;
      color: var(--text-dim);
    }

    /* Buckets */
    .bucket-row {
      margin-bottom: 14px;
    }

    .bucket-row:last-child {
      margin-bottom: 0;
    }

    .bucket-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .bucket-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    .bucket-percent {
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 9px;
      background: rgba(110, 118, 129, 0.2);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .progress-fill.high {
      background: linear-gradient(90deg, #238636 0%, #3fb950 100%);
      box-shadow: 0 0 10px rgba(63, 185, 80, 0.4);
    }

    .progress-fill.medium {
      background: linear-gradient(90deg, #9e6a03 0%, #d29922 100%);
      box-shadow: 0 0 10px rgba(210, 153, 34, 0.4);
    }

    .progress-fill.low {
      background: linear-gradient(90deg, #da3633 0%, #f85149 100%);
      box-shadow: 0 0 10px rgba(248, 81, 73, 0.4);
    }

    .bucket-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .reset-countdown {
      color: #79c0ff;
      font-weight: 600;
    }

    /* Remote Device Command Card */
    .remote-card {
      background: rgba(13, 17, 23, 0.6);
      border: 1px dashed rgba(56, 139, 253, 0.4);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    .remote-header {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .remote-command-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(1, 4, 9, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 7px;
      padding: 6px 10px;
    }

    .remote-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: #7ee787;
      word-break: break-all;
    }

    .btn-copy {
      background: rgba(56, 139, 253, 0.15);
      border: 1px solid rgba(56, 139, 253, 0.3);
      color: var(--accent);
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 5px;
      cursor: pointer;
      margin-left: 8px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-copy:hover {
      background: rgba(56, 139, 253, 0.3);
    }

    .footer {
      text-align: center;
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 8px;
    }

    /* Loading skeleton */
    .skeleton {
      opacity: 0.5;
      animation: pulse 1.2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div class="titlebar-drag"></div>

  <div class="header">
    <div class="brand">
      <div class="logo-badge">✦</div>
      <div class="title-group">
        <h1>Antigravity Usage</h1>
        <p id="updated-label">Connecting to daemon...</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-refresh" id="btn-refresh" title="Refresh Now">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path fill-rule="evenodd" d="M8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.001 7.001 0 0 1 14.95 7.16a.75.75 0 1 1-1.49.178A5.5 5.5 0 0 0 8 2.5ZM1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.001 7.001 0 0 1 1.05 8.84a.75.75 0 0 1 .655-.835Z"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="account-bar">
    <div class="user-info">
      <div class="status-dot" id="status-dot"></div>
      <span class="user-email" id="user-email">ohheysean@gmail.com</span>
    </div>
    <span class="tier-badge" id="tier-badge">Free Tier</span>
  </div>

  <div id="groups-container">
    <!-- Rendered dynamically -->
  </div>

  <div class="remote-card">
    <div class="remote-header">
      <span>Any Device Terminal Command</span>
      <span style="font-size: 9px; opacity: 0.8;">Port 3007</span>
    </div>
    <div class="remote-command-box">
      <span class="remote-code" id="remote-cmd">curl -s http://192.168.4.98:3007</span>
      <button class="btn-copy" id="btn-copy">Copy</button>
    </div>
  </div>

  <div class="footer">
    Auto-refreshes every 30 seconds · Connected via local daemon
  </div>

  <script>
    const API_URL = 'http://127.0.0.1:3007/quota';
    const groupsContainer = document.getElementById('groups-container');
    const updatedLabel = document.getElementById('updated-label');
    const userEmail = document.getElementById('user-email');
    const tierBadge = document.getElementById('tier-badge');
    const btnRefresh = document.getElementById('btn-refresh');
    const btnCopy = document.getElementById('btn-copy');
    const remoteCmd = document.getElementById('remote-cmd');

    let quotaData = null;

    function formatRelative(seconds) {
      if (seconds <= 0) return 'Ready to refresh';
      const days = Math.floor(seconds / 86400);
      const hours = Math.floor((seconds % 86400) / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const parts = [];
      if (days > 0) parts.push(days + 'd');
      if (hours > 0 || days > 0) parts.push(hours + 'h');
      parts.push(mins + 'm');
      return 'Refreshes in ' + parts.slice(0, 2).join(' ');
    }

    function renderQuota(data) {
      quotaData = data;
      userEmail.textContent = data.account || 'Active Session';
      tierBadge.textContent = (data.tier || 'Standard').replace('-', ' ');

      const updatedDate = new Date(data.fetchedAt || Date.now());
      updatedLabel.textContent = 'Updated ' + updatedDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      groupsContainer.innerHTML = '';

      (data.groups || []).forEach(group => {
        const groupName = group.displayName || group.name || 'Models';
        const isGemini = groupName.toLowerCase().includes('gemini');
        const desc = group.description || group.models || '';

        const card = document.createElement('div');
        card.className = 'group-card';

        let bucketsHtml = '';
        (group.buckets || []).forEach(b => {
          const label = b.displayName || b.label || b.kind || 'Limit';
          const fraction = Math.max(0, Math.min(1, b.remainingFraction ?? 1.0));
          const pct = (fraction * 100).toFixed(1);
          
          let colorClass = 'high';
          if (pct < 20) colorClass = 'low';
          else if (pct < 50) colorClass = 'medium';

          // Countdown
          let resetsIn = b.resetsInSeconds;
          if (resetsIn == null && (b.resetTime || b.resetAt)) {
            const resetDate = new Date(b.resetTime || b.resetAt);
            resetsIn = Math.max(0, Math.floor((resetDate - Date.now()) / 1000));
          }
          const countdownStr = resetsIn != null ? formatRelative(resetsIn) : 'Active';

          bucketsHtml += `
            <div class="bucket-row">
              <div class="bucket-meta">
                <span class="bucket-label">${label}</span>
                <span class="bucket-percent" style="color: ${pct >= 50 ? 'var(--green)' : pct >= 20 ? 'var(--yellow)' : 'var(--red)'}">${pct}%</span>
              </div>
              <div class="progress-track">
                <div class="progress-fill ${colorClass}" style="width: ${pct}%"></div>
              </div>
              <div class="bucket-footer">
                <span>${pct >= 99.9 ? 'Full quota available' : Math.round(pct) + '% remaining'}</span>
                <span class="reset-countdown">${countdownStr}</span>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="group-header">
            <span class="group-title ${isGemini ? 'gemini' : 'claude'}">
              ${isGemini ? '✦' : '⚡'} ${groupName}
            </span>
            <span class="group-models">${desc}</span>
          </div>
          ${bucketsHtml}
        `;

        groupsContainer.appendChild(card);
      });
    }

    async function fetchQuota(force = false) {
      btnRefresh.classList.add('spinning');
      try {
        const url = force ? `${API_URL}?refresh=1` : API_URL;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderQuota(data);
        document.getElementById('status-dot').style.background = 'var(--green)';
        document.getElementById('status-dot').style.boxShadow = '0 0 8px var(--green)';
      } catch (err) {
        console.error('Fetch error:', err);
        updatedLabel.textContent = 'Retrying connection...';
        document.getElementById('status-dot').style.background = 'var(--red)';
        document.getElementById('status-dot').style.boxShadow = '0 0 8px var(--red)';
      } finally {
        setTimeout(() => btnRefresh.classList.remove('spinning'), 400);
      }
    }

    btnRefresh.addEventListener('click', () => fetchQuota(true));

    btnCopy.addEventListener('click', () => {
      navigator.clipboard.writeText(remoteCmd.textContent);
      btnCopy.textContent = 'Copied!';
      setTimeout(() => btnCopy.textContent = 'Copy', 1500);
    });

    // Initial fetch
    fetchQuota();

    // Auto-refresh every 30 seconds
    setInterval(() => fetchQuota(false), 30000);
  </script>
</body>
</html>
