<!DOCTYPE html>
<!-- v4 – Ultra-clean Apple-native macOS popover design -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Usage</title>
  <style>
    :root {
      --text: #ffffff;
      --text-sec: rgba(255, 255, 255, 0.55);
      --text-muted: rgba(255, 255, 255, 0.38);
      --card: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.08);
      --track: rgba(255, 255, 255, 0.1);
      --green: #30d158;
      --yellow: #ffd60a;
      --red: #ff453a;
      --accent: #0a84ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      background: transparent;
      color: var(--text);
      padding: 16px;
      width: 360px;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .app-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .ultra-pill {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 6px;
      background: linear-gradient(135deg, rgba(255, 214, 10, 0.2) 0%, rgba(191, 90, 242, 0.25) 100%);
      color: #ffd60a;
      border: 1px solid rgba(255, 214, 10, 0.35);
    }

    .account-sub {
      font-size: 11px;
      color: var(--text-sec);
      margin-top: 2px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-sec);
      width: 26px;
      height: 26px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .icon-btn.spinning svg {
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px 14px;
      margin-bottom: 10px;
    }

    .card-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-name {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: -0.1px;
    }

    .models-hint {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Meters */
    .meter-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .meter-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .meter-label {
      color: var(--text-sec);
      font-weight: 500;
    }

    .meter-val {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .track {
      width: 100%;
      height: 5px;
      background: var(--track);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .fill.green { background: var(--green); }
    .fill.yellow { background: var(--yellow); }
    .fill.red { background: var(--red); }

    .meter-sub {
      display: flex;
      justify-content: space-between;
      font-size: 9.5px;
      color: var(--text-muted);
    }

    .timer {
      color: #64d2ff;
      font-weight: 600;
    }

    /* Footer */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
    }

    .footer-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-sec);
      font-size: 10.5px;
      font-weight: 500;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .footer-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
    }

    .updated-text {
      font-size: 9.5px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="title-row">
        <span class="app-title">Antigravity</span>
        <span class="ultra-pill" id="tier-pill">Ultra</span>
      </div>
      <div class="account-sub" id="user-email">ohheysean@gmail.com</div>
    </div>
    <button class="icon-btn" id="btn-refresh" title="Refresh">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
        <path fill-rule="evenodd" d="M8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.001 7.001 0 0 1 14.95 7.16a.75.75 0 1 1-1.49.178A5.5 5.5 0 0 0 8 2.5ZM1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.001 7.001 0 0 1 1.05 8.84a.75.75 0 0 1 .655-.835Z"></path>
      </svg>
    </button>
  </header>

  <div id="groups-container">
    <!-- Rendered cleanly -->
  </div>

  <div class="footer-bar">
    <button class="footer-btn" id="btn-copy">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor">
        <path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path>
        <path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path>
      </svg>
      <span>Copy Remote curl</span>
    </button>
    <span class="updated-text" id="updated-label">Updated now</span>
  </div>

  <script>
    const API_URL = 'http://127.0.0.1:3007/quota';
    const groupsContainer = document.getElementById('groups-container');
    const updatedLabel = document.getElementById('updated-label');
    const userEmail = document.getElementById('user-email');
    const tierPill = document.getElementById('tier-pill');
    const btnRefresh = document.getElementById('btn-refresh');
    const btnCopy = document.getElementById('btn-copy');

    function formatRelative(seconds) {
      if (seconds <= 0) return 'Ready';
      const days = Math.floor(seconds / 86400);
      const hours = Math.floor((seconds % 86400) / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const parts = [];
      if (days > 0) parts.push(days + 'd');
      if (hours > 0 || days > 0) parts.push(hours + 'h');
      parts.push(mins + 'm');
      return parts.slice(0, 2).join(' ') + ' left';
    }

    function renderQuota(data) {
      userEmail.textContent = data.account || 'Active Session';
      
      const tier = data.tier || 'Ultra';
      tierPill.textContent = tier.toLowerCase().includes('ultra') ? 'Ultra' : tier;

      const updatedDate = new Date(data.fetchedAt || Date.now());
      updatedLabel.textContent = updatedDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      groupsContainer.innerHTML = '';

      (data.groups || []).forEach(group => {
        const groupName = group.displayName || group.name || 'Models';
        const rawDesc = group.description || group.models || '';
        const cleanDesc = rawDesc.replace('Models within this group: ', '').replace(/,/g, ' ·');

        const card = document.createElement('div');
        card.className = 'card';

        let metersHtml = '';
        (group.buckets || []).forEach(b => {
          let label = b.displayName || b.label || b.kind || 'Limit';
          label = label.replace(' Remaining', '');
          
          const fraction = Math.max(0, Math.min(1, b.remainingFraction ?? 1.0));
          const pct = (fraction * 100).toFixed(0);
          
          let colorClass = 'green';
          if (pct < 20) colorClass = 'red';
          else if (pct < 50) colorClass = 'yellow';

          let resetsIn = b.resetsInSeconds;
          if (resetsIn == null && (b.resetTime || b.resetAt)) {
            const resetDate = new Date(b.resetTime || b.resetAt);
            resetsIn = Math.max(0, Math.floor((resetDate - Date.now()) / 1000));
          }
          const timerStr = resetsIn != null ? formatRelative(resetsIn) : 'Active';

          metersHtml += `
            <div>
              <div class="meter-meta">
                <span class="meter-label">${label}</span>
                <span class="meter-val" style="color: var(--${colorClass})">${pct}%</span>
              </div>
              <div class="track">
                <div class="fill ${colorClass}" style="width: ${pct}%"></div>
              </div>
              <div class="meter-sub">
                <span>${pct}% capacity</span>
                <span class="timer">${timerStr}</span>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="card-title-row">
            <span class="card-name">${groupName}</span>
            <span class="models-hint">${cleanDesc}</span>
          </div>
          <div class="meter-group">
            ${metersHtml}
          </div>
        `;

        groupsContainer.appendChild(card);
      });
    }

    async function fetchQuota(force = false) {
      btnRefresh.classList.add('spinning');
      try {
        const url = force ? `${API_URL}?refresh=1` : API_URL;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderQuota(data);
      } catch (err) {
        console.error('Fetch error:', err);
        updatedLabel.textContent = 'Connection retry...';
      } finally {
        setTimeout(() => btnRefresh.classList.remove('spinning'), 350);
      }
    }

    btnRefresh.addEventListener('click', () => fetchQuota(true));

    btnCopy.addEventListener('click', () => {
      navigator.clipboard.writeText('curl -s http://192.168.4.98:3007');
      const span = btnCopy.querySelector('span');
      span.textContent = 'Copied!';
      setTimeout(() => span.textContent = 'Copy Remote curl', 1500);
    });

    fetchQuota();
    setInterval(() => fetchQuota(false), 30000);
  </script>
</body>
</html>
